[package]
name = "fARM64"
version = "0.1.0"
edition = "2021"
rust-version = "1.74.1"
license = "MIT"
description = "A pure-Rust, no_std, zero-heap AArch64 (A64) disassembler and semantic encoder."
readme = "README.md"
keywords = ["aarch64", "arm64", "disassembler", "encoder", "no_std"]
categories = ["no-std", "encoding", "hardware-support"]
repository = "https://github.com/binsnake/fARM64"
exclude = ["/.github/", "/.claude/", "/refs/"]

# Arm architectural behavior is implemented from the Arm ARM. Apple AMX/GXF
# implementation-defined sources are recorded in NOTICE. Licensed MIT.
# The `xtask` sibling is a host-only scaffold for a future mechanical table
# generator; it is not published or run by downstream builds. The library is
# hermetic: no build.rs, no network.
[workspace]
members = ["xtask"]

# ---------------------------------------------------------------------------
# Features
#
# The DEFAULT build is `no_std` with NO `alloc` and NO `std`: a freestanding /
# no-CRT decoder + default formatter that performs ZERO heap allocation. Every
# capability that needs a heap or an OS is strictly additive and opt-in.
#
# Portability tiers (see README):
#   Tier A  default ........ no_std, no alloc  (must always build & run)
#   Tier B  feature "alloc" . String/Vec conveniences, info factory
#   Tier C  feature "std" ... std::error::Error impl, std-only test helpers
# ---------------------------------------------------------------------------
[features]
# Tier A: pure no_std, no allocator, freestanding. The guaranteed-portable core.
default = []

# Tier C: opt into the standard library. Implies `alloc`.
std = ["alloc"]

# Tier B: opt into allocator-backed String/Vec conveniences (format-to-String
# and the token-collecting String sink) plus the factory-shaped
# InstructionInfoFactory compatibility API. The current factory stores its
# cached value inline and does not itself allocate.
alloc = []

# GNU compatibility formatter; currently UAL-equivalent. Pure no_std, no alloc.
fmt-gnu = []

# ---- Compile-out gates (independent of runtime FeatureSet) -----------------
# `sve` and `sme` include their large decoder/encoder modules. `crypto` includes
# the Advanced SIMD crypto decoder; its public enum variants and encoder support
# remain available so the public type universe is stable across feature sets.
# Runtime FeatureSet checks are a separate accept/reject layer.
sme = []
sve = []
crypto = []

# Convenience meta-feature: every optional implementation module compiled in.
full = ["sme", "sve", "crypto"]

# ---- Test/bench-only audit gate (NOT for downstream use) ----
# Enables the test allocator that counts allocation calls while exercising the
# decode_into + FmtFormatter+BufSink path.
no-alloc-audit = []

# No runtime dependencies: keeps wasm32-unknown-unknown and aarch64-unknown-none
# hermetic. All names are `&'static str` from const tables; no bitflags, no libc.
[dependencies]

# Dev-deps are test/bench only and never affect the published, no_std core.
[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
# Document the full surface (all extensions + alloc/std) on docs.rs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
